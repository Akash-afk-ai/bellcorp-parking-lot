version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: bellcorp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bellcorp_parking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: bellcorp_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: bellcorp_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  postgres_data:
  mongo_data:
